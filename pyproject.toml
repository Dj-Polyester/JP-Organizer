[project]
name = "jp-organizer"
version = "0.1.0"
description = "MCP server for organizing Japanese-learning flashcards in Anki"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "httpx>=0.28.1",
    "lxml>=6.1.3",
    "mcp>=2.2.0",
    "pydantic>=2.13.5",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]

[project.scripts]
jp-organizer = "jp_organizer.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jp_organizer"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
